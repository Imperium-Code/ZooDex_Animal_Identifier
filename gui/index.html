<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZooDex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <img src="../Attach0.png" alt="ZooDex Loading" id="loading-image">
        <div class="loader">
            <div class="spinner"></div>
            <p>Booting ZooDex System...</p>
        </div>
    </div>

    <!-- Main UI -->
    <div id="main-ui" class="hidden">
        <div class="left-panel">
            <div class="led-container">
                <div class="led-big-blue"></div>
                <div class="led-small red"></div>
                <div class="led-small yellow"></div>
                <div class="led-small green"></div>
            </div>
            <div class="camera-bezel">
                <div class="camera-screen">
                    <p class="placeholder-text">Camera Feed Offline</p>
                    <div id="scanner-line"></div>
                </div>
            </div>
            <div class="primary-controls">
                <button id="scan-btn" class="dex-btn highlight">SCAN</button>
            </div>
        </div>
        
        <div class="hinge"></div>

        <div class="right-panel">
            <div class="data-screen">
                <h2 id="animal-name">UNKNOWN</h2>
                <div class="type-container">
                    <span class="type-badge">TYPE: ?</span>
                </div>
                <p id="animal-desc">Awaiting scan data...</p>
            </div>
            <div class="grid-buttons">
                <div class="grid-btn"></div>
                <div class="grid-btn"></div>
                <div class="grid-btn"></div>
                <div class="grid-btn"></div>
                <div class="grid-btn"></div>
                <div class="grid-btn"></div>
                <div class="grid-btn"></div>
                <div class="grid-btn"></div>
                <div class="grid-btn"></div>
                <div class="grid-btn"></div>
            </div>
            <div class="bottom-controls">
                <div class="d-pad">
                    <div class="d-up"></div>
                    <div class="d-right"></div>
                    <div class="d-down"></div>
                    <div class="d-left"></div>
                    <div class="d-center"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
